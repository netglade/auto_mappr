name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  auto_mappr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.0

      - uses: bluefireteam/melos-action@v3

      - name: Generate AutoMappr files
        run: melos run gen:build-all

      - name: Analyze
        run: melos run lint:dart

      - name: Get DCM version
        id: dcm-version
        run: |
          dcmVersion=$(grep '^version:' packages/auto_mappr/dcm_global.yaml | cut -d'"' -f2)
          if [ -z "$dcmVersion" ]; then
            echo "Could not read version from packages/auto_mappr/dcm_global.yaml" >&2
            exit 1
          fi
          echo "DCM_VERSION=$dcmVersion" >> "$GITHUB_OUTPUT"

      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.dcm-version.outputs.DCM_VERSION }}

      - name: Run DCM
        uses: CQLabs/dcm-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ci-key: ${{ secrets.DCM_KEY }}
          email: ${{ secrets.DCM_EMAIL }}
          folders: packages examples
          fatal-found: true

      - name: Test
        run: melos run test
